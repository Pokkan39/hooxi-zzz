# ZZZ Theme Board — 色板 Token 规范
# 来源：prototype/theme-board/tokens.css
# 6 套方向（深 3 / 浅 3），每套含 16 个语义 token。
# 当前基准（BASE）：待用户选定。
# 迁移目标：待用户提供 NarraFlow 接口路径。
#
# Token 命名约定（已按语义抽象，非原型专用 --tb-* 前缀）：
#   bg / bg-soft / bg-panel       背景三层
#   text-1 / text-2 / text-3     文字主 / 次 / 三级
#   accent / accent-2 / accent-soft  强调色 / 次要强调 / 强调底色
#   line / line-strong             分隔线弱 / 强
#   rank-s / rank-a                稀有度 S / A 标记
#   shadow / ghost                 硬阴影 / 幽灵底色

BASE: "warehouse"   # 默认基准（废仓，暗底柔和方向）；正式站 theme-tokens.css 已采用该色板为默认回退
MIGRATION_NOTE: "正式站主题代码已产出为根目录 theme-tokens.css；data-theme 切换由 body class 驱动，暂无需 NarraFlow 接口"

PALETTES:

  warehouse:
    name: 废仓
    mode: dark
    bg:        "#1c221f"
    bg-soft:   "#242b28"
    bg-panel:  "#2c332f"
    text-1:    "#d5ccb8"
    text-2:    "rgba(213,204,184,0.78)"
    text-3:    "rgba(213,204,184,0.55)"
    accent:    "#c9ad5f"
    accent-ink: "#1c221f"
    accent-2:  "#5e6b4a"
    accent-soft: "rgba(201,173,95,0.15)"
    line:      "rgba(213,204,184,0.13)"
    line-strong: "rgba(213,204,184,0.28)"
    rank-s:    "#c9ad5f"
    rank-s-ink: "#1c221f"
    rank-a:    "#d5ccb8"
    rank-a-ink: "#1c221f"
    shadow:    "#0e1110"
    ghost:     "#222826"

