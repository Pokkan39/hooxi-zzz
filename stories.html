/* ══ HOOXI Cyberpunk Override — stories.html ══ */

/* --- Base & Body --- */
.archive-stories{
  background:#08080c !important;
}
.archive-stories main{
  background:transparent;
}
body.archive-stories{
  --bg-0:#08080c;
  --bg-1:#0c1018;
  --bg-2:#0f1420;
  --bg-soft:#0e1219;
  --bg-panel:rgba(18,22,30,.7);
  --text-1:#f0f2f4;
  --text-2:rgba(240,245,250,.6);
  --text-3:rgba(240,245,250,.5);
  --text:#f0f2f4;
  --accent:#d8fa00;
  --accent-ink:#08080c;
  --accent-2:#00e5ff;
  --accent-hot:#ffe600;
  --amber:#d8fa00;
  --amber-hot:#ffe600;
  --amber-line:rgba(216,250,0,.38);
  --signal:#00e5ff;
  --signal-dim:rgba(0,229,255,.12);
  --line:rgba(255,255,255,.06);
  --line-strong:rgba(255,255,255,.1);
  --hooxi-confirm:#d8fa00;
  --selected-agent-theme:#d8fa00;
  --character-theme-rgb:216 250 0;
  transition:--selected-agent-theme .5s ease;
}

/* --- Topbar --- */
.archive-stories .topbar{
  background:rgba(8,8,12,.92) !important;
  border-bottom:1px solid rgb(var(--character-theme-rgb,216 250 0) / .2) !important;
  box-shadow:0 1px 24px rgba(0,0,0,.6),0 0 1px rgb(var(--character-theme-rgb,216 250 0) / .15) !important;
  backdrop-filter:blur(14px) saturate(1.3);
  transition:border-color .5s ease, box-shadow .5s ease;
}
.archive-stories .topbar:before{
  background:var(--selected-agent-theme,#d8fa00) !important;
  color:#08080c !important;
  transition:background .5s ease;
}
.archive-stories .brand strong{color:#f0f2f4 !important}
.archive-stories .brand .accent{color:var(--selected-agent-theme,#d8fa00) !important;transition:color .4s ease}
.archive-stories .brand small{color:rgba(240,245,250,.5) !important}
.archive-stories .top-meta{color:#00e5ff !important}
.archive-stories .signal-dot{
  background:#00e5ff !important;
  box-shadow:0 0 6px #00e5ff !important;
}

/* --- Stories Workbench Bar (Title) --- */
.archive-stories .stories-workbench-bar{
  position:relative;
  background:linear-gradient(135deg,#08080c 0%,#0c1220 50%,#08080c 100%) !important;
  border-bottom:2px solid rgb(var(--character-theme-rgb,216 250 0) / .3) !important;
  padding:28px clamp(20px,4vw,52px) !important;
  min-height:auto !important;
  overflow:hidden;
  transition:border-color .5s ease;
}
.archive-stories .stories-workbench-bar::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 600px 300px at 10% 80%,rgb(var(--character-theme-rgb,216 250 0) / .08),transparent),
    radial-gradient(ellipse 400px 250px at 90% 20%,rgba(0,229,255,.06),transparent);
  pointer-events:none;
  transition:background .6s ease;
}
.archive-stories .stories-workbench-bar::after{
  content:'AGENT DATABASE // HOOXI';
  position:absolute;
  right:clamp(20px,4vw,52px);
  bottom:8px;
  color:rgba(0,229,255,.25);
  font:700 9px/1 var(--font-mono,'Courier New',monospace);
  letter-spacing:.15em;
  pointer-events:none;
}
.archive-stories .stories-workbench-context .eyebrow{
  color:#00e5ff !important;
  text-shadow:0 0 8px rgba(0,229,255,.4);
}
.archive-stories .stories-workbench-context h1{
  color:#f0f2f4 !important;
  font-size:clamp(28px,3vw,42px) !important;
  text-shadow:0 0 20px rgb(var(--character-theme-rgb,216 250 0) / .15);
  transition:text-shadow .5s ease;
}
.archive-stories .stories-workbench-context>p:last-child{
  color:rgba(240,245,250,.55) !important;
}
.archive-stories .stories-lane-action{
  background:transparent !important;
  border:1px solid var(--selected-agent-theme,#d8fa00) !important;
  color:var(--selected-agent-theme,#d8fa00) !important;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%) !important;
  transition:all .2s ease !important;
}
.archive-stories .stories-lane-action:hover{
  background:rgb(var(--character-theme-rgb,216 250 0) / .1) !important;
  box-shadow:0 0 16px rgb(var(--character-theme-rgb,216 250 0) / .25);
  transform:translateY(-1px);
}

}

}

}
.archive-stories .agent-deep-links a{

}
.archive-stories .agent-deep-links a:hover{
  border-color:rgb(var(--character-theme-rgb,216 250 0) / .3) !important;
  background:rgb(var(--character-theme-rgb,216 250 0) / .06) !important;

}

/* --- Roster Panel --- */
.archive-stories .agent-roster-panel{
  background:linear-gradient(180deg,rgba(12,16,24,.97),rgba(8,8,12,.98)) !important;
  border-left:1px solid rgb(var(--character-theme-rgb,216 250 0) / .1) !important;

}

}

}
.archive-stories .agent-result-count{

}
.archive-stories .agent-result-count b{
  color:var(--selected-agent-theme,#d8fa00) !important;
  transition:color .4s ease;
}

/* --- Search Form --- */
.archive-stories .agent-search-form{
  border:1px solid rgba(255,255,255,.08) !important;
  background:rgba(8,8,12,.6) !important;
}
.archive-stories .agent-search-form input,
.archive-stories .agent-search-form select{
  border:1px solid rgba(255,255,255,.1) !important;
  background:rgba(12,16,24,.8) !important;
  color:#f0f2f4 !important;
}
.archive-stories .agent-search-form input:hover,
.archive-stories .agent-search-form select:hover{
  border-color:rgb(var(--character-theme-rgb,216 250 0) / .45) !important;

}
.archive-stories .agent-search-form input:focus-visible,
.archive-stories .agent-search-form select:focus-visible{

  border-color:rgb(var(--character-theme-rgb,216 250 0) / .3) !important;
}

/* --- Roster Cards --- */
.archive-stories .agent-roster-card{
  border:1px solid rgba(255,255,255,.06) !important;
  background:rgba(18,22,30,.7) !important;
  transition:all .22s ease !important;
}
.archive-stories .agent-roster-card:hover,
.archive-stories .agent-roster-card:focus-visible{
  border-color:rgb(var(--character-theme-rgb,216 250 0) / .25) !important;
  box-shadow:0 0 16px rgb(var(--character-theme-rgb,216 250 0) / .08),inset 0 0 0 1px rgb(var(--character-theme-rgb,216 250 0) / .06);
}
.archive-stories .agent-roster-card:hover:before,

  box-shadow:0 0 20px rgb(var(--character-theme-rgb,216 250 0) / .12),inset 0 0 0 1px rgb(var(--character-theme-rgb,216 250 0) / .1) !important;
}

/* --- ROSTER CARD POLISH (精细打磨层) --- */
.archive-stories .agent-roster-card{
  border-radius:12px !important;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 32%),rgba(18,22,30,.72) !important;
  border:1px solid rgba(255,255,255,.07) !important;
  box-shadow:0 2px 0 rgba(255,255,255,.04) inset,0 12px 24px -16px rgba(0,0,0,.85);
  transform:translateY(0) scale(1);
  transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .26s,box-shadow .32s cubic-bezier(.16,1,.3,1) !important;
  animation:rosterIn .5s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(var(--card-index,0)*32ms);
}
@keyframes rosterIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.archive-stories .agent-roster-card::after{
  content:'';position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 40%,rgb(var(--character-theme-rgb,216 250 0) / .18) 50%,transparent 60%);
  transform:translateX(-62%);transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .3s;
}
.archive-stories .agent-roster-card:hover{
  transform:translateY(-6px) scale(1.03);
  border-color:rgb(var(--character-theme-rgb,216 250 0) / .45) !important;
  box-shadow:0 2px 0 rgba(255,255,255,.06) inset,0 20px 36px -14px rgb(var(--character-theme-rgb,216 250 0) / .35),0 0 24px -6px rgb(var(--character-theme-rgb,216 250 0) / .28);
}
.archive-stories .agent-roster-card:hover::after,.archive-stories .agent-roster-card:focus-visible::after{opacity:1;transform:translateX(62%)}
.archive-stories .agent-roster-card:active{transform:translateY(-2px) scale(.99)}
.archive-stories .agent-roster-card:focus-visible{outline:none;border-color:var(--selected-agent-theme,#d8fa00) !important;box-shadow:0 0 0 3px rgb(var(--character-theme-rgb,216 250 0) / .35),0 14px 28px -12px rgba(0,0,0,.8) !important}
.archive-stories .agent-roster-card.is-selected{
  transform:translateY(-6px) scale(1.03);
  border-color:rgb(var(--character-theme-rgb,216 250 0) / .65) !important;
  background:linear-gradient(160deg,rgb(var(--character-theme-rgb,216 250 0) / .14),rgba(18,22,30,.9) 55%) !important;
  box-shadow:0 0 0 1px rgb(var(--character-theme-rgb,216 250 0) / .5),0 2px 0 rgba(255,255,255,.06) inset,0 22px 44px -12px rgb(var(--character-theme-rgb,216 250 0) / .5),0 0 30px -4px rgb(var(--character-theme-rgb,216 250 0) / .4) !important;
}

/* 1) 整页背景:斜切撞色块 + 网格 + 噪点 + 扫描线,主题色驱动 */
.archive-stories .agent-workbench{

/* 斜切撞色大三角 — 右上酸黄绿、左下品红,ZZZ招牌对撞 */
.archive-stories .agent-workbench::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(115deg,transparent 62%,rgb(var(--character-theme-rgb,216 250 0) / .06) 62.2%,rgb(var(--character-theme-rgb,216 250 0) / .06) 78%,transparent 78.2%),
    linear-gradient(115deg,transparent 78%,rgba(255,46,136,.05) 78.2%,rgba(255,46,136,.05) 92%,transparent 92.2%),
    linear-gradient(-38deg,transparent 70%,rgba(0,229,255,.045) 70.2%,rgba(0,229,255,.045) 88%,transparent 88.2%);
}
/* 噪点颗粒 + CRT扫描线 + 细网格叠加 */
.archive-stories .agent-workbench::after{

}

.zzz-bg-marquee{position:fixed;left:0;top:8%;width:100%;z-index:0;overflow:hidden;pointer-events:none;user-select:none;opacity:.5}
.zzz-bg-marquee .zroll{display:flex;width:max-content;animation:zzzRoll 30s linear infinite;font:900 15vw/1 Consolas,monospace;letter-spacing:.02em;white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px rgb(var(--character-theme-rgb,216 250 0) / .12)}

@keyframes zzzRoll{to{transform:translateX(-50%)}}
