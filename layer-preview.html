<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Layer Split Preview</title>
<style>
body{margin:0;background:#222;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}
h2{margin:0}
.row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.card{text-align:center}
.card img{max-width:600px;height:auto;border:1px solid #555}
.checker{background:repeating-conic-gradient(#333 0% 25%, #444 0% 50%) 0 0/20px 20px}
.parallax-demo{position:relative;width:800px;height:440px;overflow:hidden;border:2px solid #666;cursor:crosshair}
.parallax-demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.parallax-demo .bg-layer{z-index:1}
.parallax-demo .fg-layer{z-index:2}
</style>
  <link rel="stylesheet" href="zzz-global-player.css?v=gp-1"/>
</head>
<body>
<h2>Miyabi - Layer Split Result</h2>
<div class="row">
  <div class="card">
    <p>Background Layer (bg.webp)</p>
    <img src="assets/gallery/miyabi/layers/bg.webp">
  </div>
  <div class="card checker">
    <p>Foreground Layer (fg.webp)</p>
    <img src="assets/gallery/miyabi/layers/fg.webp">
  </div>
</div>
<h2>Parallax Demo (move mouse)</h2>
<div class="parallax-demo" id="demo">
  <img class="bg-layer" src="assets/gallery/miyabi/layers/bg.webp" id="bgLayer">
  <img class="fg-layer" src="assets/gallery/miyabi/layers/fg.webp" id="fgLayer">
</div>
<script>
const demo = document.getElementById('demo');
const bg = document.getElementById('bgLayer');
const fg = document.getElementById('fgLayer');
demo.addEventListener('mousemove', (e) => {
  const rect = demo.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width - 0.5;
  const y = (e.clientY - rect.top) / rect.height - 0.5;
  bg.style.transform = `translate(${x * -10}px, ${y * -8}px) scale(1.05)`;
  fg.style.transform = `translate(${x * 20}px, ${y * 15}px) scale(1.02)`;
});
</script>
  <script src="zzz-global-player.js?v=gp-1"></script>
</body>
</html>
