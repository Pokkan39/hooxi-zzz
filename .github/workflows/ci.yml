# 只跑测试，不做任何部署。
#
# 为什么单独加这个文件：仓库原先唯一的工作流是 pages.yml，它只在 push main 时
# 触发、把整个仓库全量部署到 GitHub Pages，不执行任何测试。于是 Pull Request 上
# 没有任何检查——PR 页面 checks 为空是「未配置检查」而不是「检查通过」，质量
# 兜底完全依赖有人记得在本地跑。这个工作流补上那个缺口。
#
# 刻意不纳入 test:formal：那是正式站基线比对，用文件哈希拦截未经授权的改动。
# 每次合法施工都会让它报 GATE_FAIL，直到有人明确批准后用 --write 推进基线。
# 放进 CI 会让它对每个正常 PR 都变红，反而训练大家忽略红灯。它应当保持为
# 需要人工判断的本地门禁。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 只读源码，不需要写权限；与 pages.yml 的部署权限完全隔离。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:ui 用 Playwright 起真实 Chromium 截图与断言，需要单独装浏览器与系统依赖
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 档案媒体校验 + 链接诚信 + 非官方边界
      - name: Content gates
        run: npm test

      # 截图矩阵、深链、交互、首页发布与放映检查，要求 blockingFailures 为 0
      - name: UI gates
        run: npm run test:ui

      # 失败时保留报告与截图，便于在 PR 上直接查原因而不必本地复现
      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-baseline-report
          path: artifacts/r1-baseline-*/
          retention-days: 7
          if-no-files-found: ignore
