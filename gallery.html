<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影像画廊 - 绝区零</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
.header { padding: 2rem 2rem 1rem; text-align: center; }
.header h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.3em; color: #fff; margin-bottom: 1.5rem; }
.tabs { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tab { padding: 0.5rem 1.2rem; border: 1px solid #333; border-radius: 2rem; background: transparent; color: #999; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.tab:hover { border-color: #666; color: #ccc; }
.tab.active { background: #fff; color: #0a0a0e; border-color: #fff; }
.tab .count { margin-left: 0.3rem; opacity: 0.6; font-size: 0.75rem; }
.gallery { padding: 1rem 1.5rem 3rem; }
.grid { columns: 4; column-gap: 12px; }
.grid-item { break-inside: avoid; margin-bottom: 12px; position: relative; border-radius: 6px; overflow: hidden; cursor: pointer; }
.grid-item img { width: 100%; display: block; opacity: 0; transition: opacity 0.4s; }
.grid-item img.loaded { opacity: 1; }
.grid-item .overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem 0.8rem 0.6rem; background: linear-gradient(transparent, rgba(0,0,0,0.8)); opacity: 0; transition: opacity 0.25s; font-size: 0.8rem; color: #fff; }
.grid-item:hover .overlay { opacity: 1; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 92vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
.lb-close { position: absolute; top: 1.5rem; right: 2rem; font-size: 2rem; color: #fff; cursor: pointer; z-index: 1001; }
.lb-title { color: #ccc; font-size: 0.9rem; margin-bottom: 0.8rem; }
.footer { text-align: center; padding: 2rem; color: #555; font-size: 0.8rem; border-top: 1px solid #1a1a1e; margin: 0 1.5rem; }
@media (max-width: 1200px) { .grid { columns: 3; } }
@media (max-width: 800px) { .grid { columns: 2; } }
@media (max-width: 480px) { .grid { columns: 1; } }
</style>
  <link rel="stylesheet" href="zzz-global-player.css?v=gp-1"/>
</head>
<body>
<div class="header">
  <h1>影 像 画 廊</h1>
  <div class="tabs" id="tabs"></div>
</div>
<div class="gallery" id="gallery"></div>
<div class="lightbox" id="lightbox">
  <div class="lb-close" id="lb-close">&times;</div>
  <div class="lb-title" id="lb-title"></div>
  <img id="lb-img" src="" alt="">
</div>
<div class="footer" id="footer"></div>
<script>
const DATA_URL = './assets/data/wallpapers.json';
let allData = null;
let currentCat = 'all';

async function init() {
  const res = await fetch(DATA_URL);
  allData = await res.json();
  renderTabs();
  renderGallery();
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const total = allData.categories.reduce((s, c) => s + c.count, 0);
  let html = `<button class="tab active" data-cat="all">全部<span class="count">${total}</span></button>`;
  allData.categories.forEach(c => {
    html += `<button class="tab" data-cat="${c.id}">${c.name}<span class="count">${c.count}</span></button>`;
  });
  tabs.innerHTML = html;
  tabs.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      renderGallery();
    });
  });
  document.getElementById('footer').textContent = `共收录 ${total} 张壁纸`;
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  let items = [];
  if (currentCat === 'all') {
    allData.categories.forEach(c => items.push(...c.items));
  } else {
    const cat = allData.categories.find(c => c.id === currentCat);
    if (cat) items = cat.items;
  }
  let html = '<div class="grid">';
  items.forEach((item, i) => {
    const title = item.title && item.title !== String(i+1) ? item.title : '';
    html += `<div class="grid-item" data-idx="${i}">`;
    html += `<img data-src="${item.src}" alt="${title}" loading="lazy">`;
    if (title) html += `<div class="overlay">${title}</div>`;
    html += `</div>`;
  });
  html += '</div>';
  gallery.innerHTML = html;
  observeImages();
}

function observeImages() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        img.src = img.dataset.src;
        img.onload = () => img.classList.add('loaded');
        observer.unobserve(img);
      }
    });
  }, { rootMargin: '200px' });
  document.querySelectorAll('.grid-item img[data-src]').forEach(img => observer.observe(img));
}

// Lightbox
document.getElementById('gallery').addEventListener('click', (e) => {
  const item = e.target.closest('.grid-item');
  if (!item) return;
  const img = item.querySelector('img');
  const lb = document.getElementById('lightbox');
  document.getElementById('lb-img').src = img.dataset.src || img.src;
  document.getElementById('lb-title').textContent = img.alt || '';
  lb.classList.add('show');
});
document.getElementById('lb-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('show');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('lightbox').classList.remove('show');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('show');
});

init();
</script>
  <script src="zzz-global-player.js?v=gp-1"></script>
</body>
</html>
