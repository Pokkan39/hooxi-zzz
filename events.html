/* ═══════════════════════════════════════════════════════════
   Events Page — Cyberpunk Dark Redesign
   ═══════════════════════════════════════════════════════════ */

/* ── Base Reset ── */
body.archive-events{
  background:#08080c!important;
  background-image:
    radial-gradient(ellipse 900px 500px at 75% -5%,rgba(0,229,255,.04),transparent 60%),
    radial-gradient(ellipse 600px 400px at 10% 30%,rgba(216,250,0,.03),transparent 50%),
    linear-gradient(180deg,#08080c 0%,#0a0e14 50%,#08080c 100%)!important;
  color:#f0f2f4!important;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
  min-height:100vh;
}

/* Noise overlay */
body.archive-events::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.025;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

body.archive-events *{position:relative;z-index:1}

/* ── Topbar ── */
body.archive-events .archive-topbar{
  background:rgba(8,8,12,.92)!important;
  backdrop-filter:blur(12px) saturate(1.2);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid rgba(216,250,0,.12)!important;
  padding:12px 24px!important;
}
body.archive-events .archive-topbar .brand strong{color:#f0f2f4!important}
body.archive-events .archive-topbar .brand small{color:rgba(240,245,250,.5)!important}
body.archive-events .archive-topbar .brand-mark{
  background:#d8fa00!important;
  color:#08080c!important;
}
body.archive-events .archive-topbar nav a{
  color:rgba(240,245,250,.6)!important;
  text-decoration:none;
  transition:color .2s;
}
body.archive-events .archive-topbar nav a:hover,
body.archive-events .archive-topbar nav a[aria-current="page"]{
  color:#d8fa00!important;
}

/* ── Hero Section ── */
body.archive-events .archive-hero{
  background:linear-gradient(135deg,rgba(8,8,12,.98) 0%,rgba(10,14,20,.95) 100%)!important;
  border-bottom:1px solid rgba(255,255,255,.06)!important;
  padding:80px 32px 60px!important;
  text-align:center;
  position:relative;
  overflow:hidden;
}
/* Hero decorative grid lines */
body.archive-events .archive-hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(90deg,transparent,transparent 119px,rgba(216,250,0,.04) 119px,rgba(216,250,0,.04) 120px),
    repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(0,229,255,.03) 79px,rgba(0,229,255,.03) 80px);
  pointer-events:none;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 20%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 20%,transparent 70%);
}
body.archive-events .archive-hero .eyebrow{
  color:#00e5ff!important;
  font:700 11px/1.4 "Barlow Condensed","Segoe UI",monospace;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:12px;
}
body.archive-events .archive-hero h1{
  color:#f0f2f4!important;
  font:900 clamp(36px,6vw,56px)/1.05 "Barlow Condensed","Microsoft YaHei UI",sans-serif;
  margin:0 0 16px;
  letter-spacing:-.01em;
}
body.archive-events .archive-hero h1::before{
  content:"/";
  color:#d8fa00;
  margin-right:12px;
  font-weight:400;
}
body.archive-events .archive-hero>p:last-of-type{
  color:rgba(240,245,250,.6)!important;
  font-size:15px;
  max-width:520px;
  margin:0 auto 24px;
  line-height:1.6;
}
body.archive-events .archive-primary-action{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 28px;
  background:#d8fa00!important;
  color:#08080c!important;
  font:800 13px/1 "Barlow Condensed","Segoe UI",sans-serif;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-decoration:none;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  transition:transform .15s,box-shadow .15s;
}
body.archive-events .archive-primary-action:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 6px 24px rgba(216,250,0,.3);
}

/* ── Section Headings ── */
body.archive-events .section-head{
  margin:48px auto 24px!important;
  max-width:1100px;
  padding:0 24px;
}
body.archive-events .section-head h2{
  color:#f0f2f4!important;
  font:800 clamp(22px,3vw,30px)/1.2 "Barlow Condensed","Microsoft YaHei UI",sans-serif;
  margin:0 0 6px;
}
body.archive-events .section-head h2::before{
  content:"";
  display:inline-block;
  width:3px;
  height:.78em;
  margin-right:12px;
  background:#d8fa00;
  transform:skewX(-12deg);
  vertical-align:middle;
}
body.archive-events .section-head p{
  color:rgba(240,245,250,.5)!important;
  font-size:13px;
  margin:0;
}

/* ── Filter Bar ── */
body.archive-events .archive-filter-bar{
  display:grid;
  grid-template-columns:1fr auto auto auto auto auto;
  gap:10px;
  align-items:end;
  max-width:1100px;
  margin:0 auto 28px;
  padding:18px 20px;
  background:rgba(18,22,30,.7);
  border:1px solid rgba(255,255,255,.06);
  border-left:3px solid #d8fa00;
}
body.archive-events .archive-filter-bar label{
  display:grid;
  gap:4px;
  color:rgba(240,245,250,.5);
  font:700 9px/1.3 monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
}
body.archive-events .archive-filter-bar input,
body.archive-events .archive-filter-bar select{
  min-height:36px;
  padding:6px 10px;
  background:#0c1018;
  border:1px solid rgba(255,255,255,.1);
  border-radius:0;
  color:#f0f2f4;
  font:600 12px/1.3 "Segoe UI",sans-serif;
  color-scheme:dark;
  transition:border-color .15s;
}
body.archive-events .archive-filter-bar input:focus,
body.archive-events .archive-filter-bar select:focus{
  outline:none;
  border-color:#d8fa00;
  box-shadow:0 0 0 1px rgba(216,250,0,.2);
}
body.archive-events .archive-filter-bar output{
  color:rgba(240,245,250,.5);
  font:700 11px/36px monospace;
  white-space:nowrap;
}
body.archive-events .archive-filter-bar button[data-filter-clear]{
  min-height:36px;
  padding:6px 14px;
  background:transparent;
  border:1px solid rgba(0,229,255,.3);
  color:#00e5ff;
  font:700 11px/1 monospace;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
body.archive-events .archive-filter-bar button[data-filter-clear]:hover{
  background:rgba(0,229,255,.08);
  border-color:#00e5ff;
}
/* ── Version Group (Collapsible Panel) ── */
body.archive-events .archive-group{
  max-width:1100px;
  margin:0 auto 16px;
  background:rgba(18,22,30,.5);
  border:1px solid rgba(255,255,255,.06);
  border-radius:0;
  transition:background .2s,border-color .2s;
}
body.archive-events .archive-group[open]{
  background:rgba(18,22,30,.7);
  border-color:rgba(216,250,0,.15);
}
body.archive-events .archive-group>summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  cursor:pointer;
  list-style:none;
  user-select:none;
  transition:background .15s;
}
body.archive-events .archive-group>summary::-webkit-details-marker{display:none}
body.archive-events .archive-group>summary::before{
  content:"▸";
  color:#d8fa00;
  font-size:14px;
  margin-right:12px;
  transition:transform .2s;
}
body.archive-events .archive-group[open]>summary::before{
  transform:rotate(90deg);
}
body.archive-events .archive-group>summary:hover{
  background:rgba(216,250,0,.03);
}
body.archive-events .archive-group>summary>span{
  color:#f0f2f4;
  font:700 15px/1.3 "Barlow Condensed","Segoe UI",sans-serif;
  letter-spacing:.02em;
}
body.archive-events .archive-group>summary>b{
  display:inline-flex;
  align-items:center;
  padding:3px 10px;
  background:rgba(0,229,255,.1);
  border:1px solid rgba(0,229,255,.25);
  color:#00e5ff;
  font:700 10px/1.4 monospace;
  letter-spacing:.04em;
  white-space:nowrap;
}
body.archive-events .archive-group-records{
  padding:8px 16px 16px;
  display:grid;
  gap:10px;
}

/* ── Individual Record Card ── */
body.archive-events .archive-record{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:14px;
  padding:14px 16px;
  background:rgba(12,16,24,.6);
  border:1px solid rgba(255,255,255,.04);
  border-left:3px solid transparent;
  transition:background .15s,border-color .2s,transform .15s;
}
body.archive-events .archive-record:hover{
  background:rgba(18,22,30,.9);
  border-left-color:#d8fa00;
  transform:translateX(2px);
}
body.archive-events .archive-record-cover{
  width:64px;
  height:64px;
  overflow:hidden;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
body.archive-events .archive-record-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:saturate(.9);
  transition:filter .2s,transform .2s;
}
body.archive-events .archive-record:hover .archive-record-cover img{
  filter:saturate(1.1);
  transform:scale(1.05);
}
body.archive-events .archive-record-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}
body.archive-events .archive-record-meta{
  color:#00e5ff!important;
  font:700 10px/1.3 monospace;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin:0;
}
body.archive-events .archive-record-copy h3{
  color:#f0f2f4!important;
  font:700 14px/1.35 "Segoe UI","Microsoft YaHei UI",sans-serif;
  margin:0;
}
body.archive-events .archive-record-summary{
  color:rgba(240,245,250,.55)!important;
  font-size:12px;
  line-height:1.5;
  margin:0;
}
/* ── Source Links ── */
body.archive-events .archive-source-action{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:4px;
  padding:3px 0;
  color:#d8fa00!important;
  font:700 11px/1.3 "Barlow Condensed","Segoe UI",sans-serif;
  letter-spacing:.04em;
  text-decoration:none;
  transition:color .15s;
}
body.archive-events .archive-source-action:hover{
  color:#00e5ff!important;
}
body.archive-events .archive-source-action.is-disabled{
  color:rgba(240,245,250,.3)!important;
  cursor:default;
}
body.archive-events .archive-record-details{
  margin-top:8px;
  padding:10px 12px;
  background:rgba(8,8,12,.6);
  border:1px solid rgba(255,255,255,.04);
}
body.archive-events .archive-record-details dl{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:6px 16px;
  margin:0;
}
body.archive-events .archive-record-details dt{
  color:rgba(240,245,250,.4);
  font:700 9px/1.4 monospace;
  text-transform:uppercase;
  letter-spacing:.06em;
}
body.archive-events .archive-record-details dd{
  color:rgba(240,245,250,.7);
  font-size:12px;
  margin:0 0 4px;
}
body.archive-events [data-archive-disclosure]>summary{
  color:#00e5ff;
  font-size:11px;
  cursor:pointer;
  margin-top:6px;
}

/* ── Sources Section ── */
body.archive-events .archive-sources{
  max-width:1100px;
  margin:48px auto 0;
  padding:32px 24px;
  border-top:1px solid rgba(255,255,255,.06);
}
body.archive-events .archive-sources h2{
  color:#f0f2f4!important;
  font-size:20px;
}
body.archive-events .archive-sources h2::before{
  content:"";
  display:inline-block;
  width:3px;
  height:.7em;
  margin-right:10px;
  background:#d8fa00;
  transform:skewX(-12deg);
  vertical-align:middle;
}
body.archive-events .archive-sources>p{
  color:rgba(240,245,250,.5)!important;
  line-height:1.6;
}
body.archive-events .archive-sources ul{
  list-style:none;
  padding:0;
  margin:16px 0 0;
  display:grid;
  gap:8px;
}
body.archive-events .archive-sources li{
  display:flex;
  flex-wrap:wrap;
  gap:8px 14px;
  color:rgba(240,245,250,.6);
  font-size:13px;
}
body.archive-events .archive-sources a{
  color:#d8fa00;
  text-decoration:none;
}
body.archive-events .archive-sources a:hover{
  color:#00e5ff;
}

/* ── Footer ── */
body.archive-events .archive-footer{
  background:rgba(8,8,12,.95)!important;
  border-top:1px solid rgba(255,255,255,.06)!important;
  padding:24px 32px!important;
  text-align:center;
}
body.archive-events .archive-footer .footer-disclaimer{
  color:rgba(240,245,250,.4)!important;
  font-size:11px;
}

/* ── Empty State ── */
body.archive-events .archive-empty{
  text-align:center;
  padding:60px 20px;
  color:rgba(240,245,250,.4);
  font-size:14px;
}

/* ── Focus Record Highlight ── */
body.archive-events .archive-record-focus{
  animation:record-pulse .8s ease-out;
}
@keyframes record-pulse{
  0%{box-shadow:0 0 0 0 rgba(216,250,0,.4)}
  70%{box-shadow:0 0 0 8px rgba(216,250,0,0)}
  100%{box-shadow:0 0 0 0 rgba(216,250,0,0)}
}

/* ── Page Timeline Container ── */
body.archive-events .page-timeline{
  padding:0 24px;
}
body.archive-events .archive-content{
  padding-bottom:48px;
}

/* ── Responsive: Tablet ── */
@media(max-width:900px){
  body.archive-events .archive-filter-bar{
    grid-template-columns:1fr 1fr;
    padding:14px 16px;
  }
  body.archive-events .archive-filter-bar label:first-child{
    grid-column:1 / -1;
  }
  body.archive-events .archive-hero{
    padding:60px 20px 48px!important;
  }
}

/* ── Responsive: Mobile ── */
@media(max-width:600px){
  body.archive-events .archive-filter-bar{
    grid-template-columns:1fr;
    gap:8px;
  }
  body.archive-events .archive-record{
    grid-template-columns:1fr;
    gap:10px;
  }
  body.archive-events .archive-record-cover{
    width:100%;
    height:120px;
  }
  body.archive-events .archive-group>summary{
    padding:12px 14px;
  }
  body.archive-events .archive-group-records{
    padding:6px 10px 12px;
  }
  body.archive-events .archive-hero{
    padding:48px 16px 36px!important;
  }
  body.archive-events .section-head,
  body.archive-events .page-timeline{
    padding:0 14px;
  }
  body.archive-events .archive-sources{
    padding:24px 14px;
  }
}

/* ── Scrollbar styling ── */
body.archive-events ::-webkit-scrollbar{width:6px;height:6px}
body.archive-events ::-webkit-scrollbar-track{background:#08080c}
body.archive-events ::-webkit-scrollbar-thumb{background:rgba(216,250,0,.25);border-radius:3px}
body.archive-events ::-webkit-scrollbar-thumb:hover{background:rgba(216,250,0,.4)}
body.archive-events{scrollbar-color:rgba(216,250,0,.25) #08080c;scrollbar-width:thin}

/* ── Accessibility ── */
body.archive-events :is(a,button,input,select,summary):focus-visible{
  outline:2px solid #00e5ff;
  outline-offset:2px;
}
</style>
